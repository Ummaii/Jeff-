<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You </title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #2c003e 0%, #1a0029 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Gmail Notification */
        .notification {
            position: absolute;
            top: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.8s ease;
            cursor: pointer;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
        }

        /* Ultra Premium Email */
        .email-box {
            width: 260px;
            height: 170px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(40px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(255, 107, 129, 0.4);
            cursor: pointer;
            position: relative;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            animation: float 4s ease-in-out infinite;
        }

        .email-box:hover {
            transform: scale(1.1);
            box-shadow: 0 0 80px rgba(255, 107, 129, 0.7);
        }

        .email-flap {
            position: absolute;
            top: 0;
            width: 100%;
            height: 85px;
            background: linear-gradient(135deg, #ff6b81, #c44569);
            clip-path: polygon(0 0, 50% 70%, 100% 0);
            border-radius: 20px 20px 0 0;
            transition: transform 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-origin: top;
        }

        .email-box.open .email-flap {
            transform: rotateX(180deg);
        }

        /* Premium Message with Photo */
        .message {
            position: absolute;
            width: 420px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            opacity: 0;
            transform: scale(0.5) translateY(50px);
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .email-box.open~.message {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .message img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff6b81;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 107, 129, 0.5);
        }

        .message h1 {
            font-family: 'Great Vibes', cursive;
            color: #fff;
            font-size: 42px;
            text-shadow: 0 0 20px rgba(255, 107, 129, 0.8);
        }
    </style>
</head>

<body><canvas id="particles"></canvas>
    <div class="notification" onclick="document.querySelector('.email-box').click()">  New Message from Me</div>
    <div class="email-box" onclick="openEmail()">  <div class="email-flap"></div>  <div
            style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;"> </div>
    </div>
    <div class="message">  <img src="image/1.jpg"alt="team-2.jpg">  <h1
            id="title">Happy Girlfriend’s Day</h1>  <p id="text" style="color:#fff; font-size:18px; margin-top:15px;">
        </p>
    </div>
    <script>const name = new URLSearchParams(window.location.search).get('to') || 'Baby'; document.getElementById('text').innerHTML = `To ${name},<br>You are my favorite notification.<br>I love you infinitely `;
        function openEmail() { document.querySelector('.email-box').classList.add('open'); document.querySelector('.notification').style.display = 'none'; typeWriter(); blastParticles(); }
        let i = 0; function typeWriter() { const txt = ` To you Hanna Dairocas❤️ you're the most amazing girl in my world.<br>
  Clicking this email was the best decision you made today.<br>
  I love you more than code loves bugs 😂 `; if (i < txt.length) { document.getElementById('text').innerHTML = txt.substring(0, i + 1); i++; setTimeout(typeWriter, 50); } }
        // Premium particle systemconst canvas = document.getElementById('particles');const ctx = canvas.getContext('2d');canvas.width = innerWidth; canvas.height = innerHeight;let parts = [];function blastParticles() {  for(let j=0; j<150; j++) {    parts.push({x: innerWidth/2, y: innerHeight/2, r: Math.random()*6+2,     a: Math.random()*Math.PI*2, v: Math.random()*8+2, c: `hsl(${Math.random()*60+330},100%,60%)`});  }  draw();}function draw() {  ctx.clearRect(0,0,canvas.width,canvas.height);  parts.forEach(p => {    p.x += Math.cos(p.a)*p.v; p.y += Math.sin(p.a)*p.v; p.v *= 0.98;    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle = p.c; ctx.fill();  });  if(parts.length) requestAnimationFrame(draw);}</script>
</body>

</html>
